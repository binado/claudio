[package]
name = "claudio"
version = "0.1.0"
edition = "2024"

[lib]
name = "claudio"
path = "src/lib.rs"

[[bin]]
name = "claudio"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
directories = "5.0"
anyhow = "1.0"
comfy-table = "7"
tempfile = "3"
colored = "2.1"

[dev-dependencies]
serial_test = "3"
